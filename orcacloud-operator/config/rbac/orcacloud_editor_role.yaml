# This rule is not used by the project orcacloud-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the cache.orcacloud.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: orcacloud-operator
    app.kubernetes.io/managed-by: kustomize
  name: orcacloud-editor-role
rules:
- apiGroups:
  - cache.orcacloud.com
  resources:
  - orcaclouds
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cache.orcacloud.com
  resources:
  - orcaclouds/status
  verbs:
  - get
