# Bitbucket Pipelines Configuration for OrcaCloud
image: atlassian/default-image:3

definitions:
  services:
    postgres:
      image: postgres:15
      variables:
        POSTGRES_DB: test_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
    redis:
      image: redis:7

  caches:
    pip: ~/.cache/pip
    npm: ~/.npm

  steps:
    - step: &test-cloudapi
        name: Test cloudapi
        image: python:3.11
        services:
          - postgres
          - redis
        caches:
          - pip
        script:
          - cd cloudapi
          - pip install --upgrade pip
          - pip install -r requirements.txt
          - pip install pytest pytest-django pytest-cov flake8 black isort bandit safety
          # Linting
          - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          - black --check .
          - isort --check-only .
          # Security checks
          - bandit -r . -x tests
          - safety check
          # Tests
          - export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test_db
          - export REDIS_URL=redis://localhost:6379/0
          - export SECRET_KEY=test-secret-key
          - export DEBUG=True
          - python manage.py collectstatic --noinput
          - pytest --cov=. --cov-report=xml --cov-report=html
        artifacts:
          - cloudapi/coverage.xml
          - cloudapi/htmlcov/**

    - step: &test-webapp
        name: Test webapp
        image: node:18
        caches:
          - npm
        script:
          - cd webapp
          - npm ci
          - npm run lint
          - npm run type-check
          - npm run test:coverage
        artifacts:
          - webapp/coverage/**

    - step: &security-scan
        name: Security Scan
        image: aquasec/trivy:latest
        script:
          - trivy fs --format sarif --output trivy-results.sarif .
        artifacts:
          - trivy-results.sarif

    - step: &build-cloudapi
        name: Build cloudapi Image
        image: docker:latest
        services:
          - docker
        script:
          - export IMAGE_TAG=${BITBUCKET_COMMIT:0:8}
          - export DOCKER_REGISTRY=${DOCKER_REGISTRY:-ghcr.io}
          - export IMAGE_NAME="$DOCKER_REGISTRY/orcacloud/orcacloud/cloudapi"
          # Build and tag image
          - cd cloudapi
          - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
          # Login to registry: prefer GHCR token if provided, fall back to DOCKER_USERNAME/DOCKER_PASSWORD
          - |
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            else
              echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
            fi
          # Push image
          - docker push $IMAGE_NAME:$IMAGE_TAG
          - docker push $IMAGE_NAME:latest

    - step: &build-webapp
        name: Build webapp Image
        image: docker:latest
        services:
          - docker
        script:
          - export IMAGE_TAG=${BITBUCKET_COMMIT:0:8}
          - export DOCKER_REGISTRY=${DOCKER_REGISTRY:-ghcr.io}
          - export IMAGE_NAME="$DOCKER_REGISTRY/orcacloud/orcacloud/webapp"
          # Build and tag image
          - cd webapp
          - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
          # Login to registry: prefer GHCR token if provided, fall back to DOCKER_USERNAME/DOCKER_PASSWORD
          - |
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            else
              echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin $DOCKER_REGISTRY
            fi
          # Push image
          - docker push $IMAGE_NAME:$IMAGE_TAG
          - docker push $IMAGE_NAME:latest

    - step: &deploy-to-k8s
        name: Deploy to Kubernetes
        image: atlassian/pipelines-kubectl
        script:
          # Configure kubectl
          - echo $KUBE_CONFIG | base64 -d > ~/.kube/config
          - export IMAGE_TAG=${BITBUCKET_COMMIT:0:8}
          # Update image tags
          - sed -i "s|image:.*cloudapi:.*|image: $DOCKER_REGISTRY/orcacloud/orcacloud/cloudapi:$IMAGE_TAG|g" k8s/overlays/$ENVIRONMENT/kustomization.yaml
          - sed -i "s|image:.*webapp:.*|image: $DOCKER_REGISTRY/orcacloud/orcacloud/webapp:$IMAGE_TAG|g" k8s/overlays/$ENVIRONMENT/kustomization.yaml
          # Ensure project namespace exists and set as default
          - kubectl create namespace orcacloud || true
          - kubectl config set-context --current --namespace=orcacloud
          # Deploy
          - kubectl apply -k k8s/overlays/$ENVIRONMENT/
          # Wait for rollout
          - kubectl rollout status deployment/orcacloud-backend
          - kubectl rollout status deployment/frontend

    # Removed AWS Terraform steps - no longer using AWS infrastructure

pipelines:
  # Feature branch pipeline
  branches:
    feature/*:
      - parallel:
          - step: *test-cloudapi
          - step: *test-webapp
          - step: *security-scan

    # Development branch pipeline
    develop:
      - parallel:
          - step: *test-cloudapi
          - step: *test-webapp
          - step: *security-scan
      - parallel:
          - step:
              <<: *build-cloudapi
              name: Build cloudapi for Dev
          - step:
              <<: *build-webapp
              name: Build webapp for Dev
      - step:
          <<: *deploy-to-k8s
          name: Deploy to Development
          deployment: development
          variables:
            ENVIRONMENT: development
            NAMESPACE_SUFFIX: -dev

    # Main branch pipeline
    main:
      - parallel:
          - step: *test-cloudapi
          - step: *test-webapp
          - step: *security-scan
      - parallel:
          - step:
              <<: *build-cloudapi
              name: Build cloudapi for Prod
          - step:
              <<: *build-webapp
              name: Build webapp for Prod
      - step:
          <<: *deploy-to-k8s
          name: Deploy to Production
          deployment: production
          trigger: manual
          variables:
            ENVIRONMENT: production
            NAMESPACE_SUFFIX: ""
      - step:
          name: Smoke Tests
          image: curlimages/curl
          script:
            - sleep 30  # Wait for deployment
            - curl -f https://api.orcacloud.com/api/health/ || exit 1
            - curl -f https://orcacloud.com/ || exit 1
            - echo "[OK] Deployment successful and smoke tests passed"

    # Infrastructure pipeline (Kubernetes only - no AWS Terraform)
    infrastructure/*:
      # Use Kubernetes manifests instead of Terraform for infrastructure
      - step:
          name: Deploy Infrastructure to Kubernetes
          <<: *deploy-to-k8s

  # Manual deployment pipelines
  custom:
    deploy-staging:
      - parallel:
          - step: *test-cloudapi
          - step: *test-webapp
      - parallel:
          - step:
              <<: *build-cloudapi
              name: Build cloudapi for Staging
          - step:
              <<: *build-webapp
              name: Build webapp for Staging
      - step:
          <<: *deploy-to-k8s
          name: Deploy to Staging
          deployment: staging
          variables:
            ENVIRONMENT: staging
            NAMESPACE_SUFFIX: -staging

    # Removed terraform-apply and terraform-destroy pipelines
    # Infrastructure is now managed through Kubernetes manifests

  # Pull request pipeline
  pull-requests:
    '**':
      - parallel:
          - step: *test-cloudapi
          - step: *test-webapp
          - step: *security-scan

  # Tag pipeline for releases
  tags:
    'v*':
      - parallel:
          - step: *test-cloudapi
          - step: *test-webapp
          - step: *security-scan
      - parallel:
          - step:
              <<: *build-cloudapi
              name: Build cloudapi Release
          - step:
              <<: *build-webapp
              name: Build webapp Release
      - step:
          name: Create GitHub Release
          image: atlassian/pipelines-awscli
          script:
            - |
              curl -X POST \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/$BITBUCKET_REPO_FULL_NAME/releases \
                -d "{
                  \"tag_name\": \"$BITBUCKET_TAG\",
                  \"name\": \"Release $BITBUCKET_TAG\",
                  \"body\": \"Release created from Bitbucket Pipelines\",
                  \"draft\": false,
                  \"prerelease\": false
                }"
