name: orcacloud-local-domains

networks:
  orcacloud-local:
    driver: bridge

volumes:
  local_postgres:
  local_redis:

x-backend-common: &backend-common
  image: orcacloud-local-backend:latest
  pull_policy: never
  environment:
    DEBUG: "True"
    SECRET_KEY: ${SECRET_KEY:-local-development-only}
    POSTGRES_DB: ${POSTGRES_DB:-orcacloud}
    POSTGRES_USER: ${POSTGRES_USER:-orcacloud_user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orcacloud_dev_password}
    DATABASE_URL: postgresql://${POSTGRES_USER:-orcacloud_user}:${POSTGRES_PASSWORD:-orcacloud_dev_password}@db:5432/${POSTGRES_DB:-orcacloud}
    REDIS_URL: redis://redis:6379/0
    ALLOWED_HOSTS: "*"
    AUTH_COOKIE_DOMAIN: ""
  command: python manage.py runserver 0.0.0.0:8000
  networks: [orcacloud-local]
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

x-frontend-common: &frontend-common
  networks: [orcacloud-local]
  depends_on:
    computeapi:
      condition: service_started

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orcacloud}
      POSTGRES_USER: ${POSTGRES_USER:-orcacloud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orcacloud_dev_password}
    volumes:
      - local_postgres:/var/lib/postgresql/data
    networks: [orcacloud-local]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orcacloud_user} -d ${POSTGRES_DB:-orcacloud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - local_redis:/data
    networks: [orcacloud-local]

  computeapi:
    <<: *backend-common
    build:
      context: ./computeapi
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]

  cloudapp:
    <<: *frontend-common
    build:
      context: ./cloudapp
      dockerfile: Dockerfile
      args:
        API_UPSTREAM: computeapi:8000
        REACT_APP_API_URL: /api
        REACT_APP_ENVIRONMENT: local-multi-dashboard
        REACT_APP_PORTAL_PUBLIC_PORT: "3000"
    ports: ["3000:80"]

  domainapp:
    <<: *frontend-common
    build:
      context: ./domainapp
      dockerfile: Dockerfile
      args:
        API_UPSTREAM: computeapi:8000
        REACT_APP_API_URL: /api
        REACT_APP_ACCOUNT_URL: http://localhost:5000
        REACT_APP_ENVIRONMENT: local-multi-dashboard
        REACT_APP_PORTAL_PUBLIC_PORT: "3001"
    ports: ["3001:80"]

  devopsapp:
    <<: *frontend-common
    build:
      context: ./devopsapp
      dockerfile: Dockerfile
      args:
        API_UPSTREAM: computeapi:8000
        REACT_APP_API_URL: /api
        REACT_APP_ENVIRONMENT: local-multi-dashboard
        REACT_APP_PORTAL_PUBLIC_PORT: "3002"
    ports: ["3002:80"]

  emailapp:
    <<: *frontend-common
    build:
      context: ./emailapp
      dockerfile: Dockerfile
      args:
        API_UPSTREAM: computeapi:8000
        REACT_APP_API_URL: /api
        REACT_APP_ENVIRONMENT: local-multi-dashboard
        REACT_APP_PORTAL_PUBLIC_PORT: "3003"
    ports: ["3003:80"]

  enterpriseapp:
    <<: *frontend-common
    build:
      context: ./enterpriseapp
      dockerfile: Dockerfile
      args:
        API_UPSTREAM: computeapi:8000
        REACT_APP_API_URL: /api
        REACT_APP_ENVIRONMENT: local-multi-dashboard
        REACT_APP_PORTAL_PUBLIC_PORT: "4000"
    ports: ["4000:80"]

  accountapp:
    <<: *frontend-common
    build:
      context: ./accountapp
      dockerfile: Dockerfile
      args:
        API_UPSTREAM: computeapi:8000
        REACT_APP_API_URL: /api
        REACT_APP_ENVIRONMENT: local-multi-dashboard
        REACT_APP_PORTAL_PUBLIC_PORT: "5000"
    ports: ["5000:80"]

  webapp:
    <<: *frontend-common
    build:
      context: ./webapp
      dockerfile: Dockerfile
      args:
        API_UPSTREAM: computeapi:8000
        REACT_APP_API_URL: /api
        REACT_APP_ACCOUNT_URL: http://localhost:5000
        REACT_APP_ENVIRONMENT: local-multi-dashboard
        REACT_APP_PORTAL_PUBLIC_PORT: "8081"
    ports: ["8081:80"]
