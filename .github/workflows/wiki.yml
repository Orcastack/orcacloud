name: Publish GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish Wiki Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify GitHub Wiki is initialized
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          wiki_enabled="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${WIKI_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | \
            jq -r '.has_wiki')"
          if [[ "$wiki_enabled" != "true" ]]; then
            echo "GitHub Wiki is disabled for ${GITHUB_REPOSITORY}."
            echo "An owner must enable Settings -> General -> Features -> Wikis,"
            echo "then open the Wiki tab and save its first page once."
            echo "After GitHub creates ${GITHUB_REPOSITORY}.wiki.git, rerun this workflow."
            exit 1
          fi

      - name: Synchronize GitHub Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-target
          find wiki-target -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R wiki/. wiki-target/
          cd wiki-target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "docs: publish wiki from ${GITHUB_SHA}"
          git push origin HEAD:master
