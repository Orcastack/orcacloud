name: Publish GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish Wiki Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Synchronize GitHub Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-target
          find wiki-target -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R wiki/. wiki-target/
          cd wiki-target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "docs: publish wiki from ${GITHUB_SHA}"
          git push origin HEAD:master
