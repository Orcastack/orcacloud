name: OrcaCloud MLOps

on:
  push:
    branches: [main]
    paths:
      - 'mlops/**'
      - 'scripts/run-mlops.sh'
      - '.github/workflows/mlops.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  train-and-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define inference image
        id: inference-image
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/orcacloud-ml-inference:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Package inference runtime
        run: docker build --tag "${{ steps.inference-image.outputs.tag }}" --file mlops/Dockerfile .
      - name: Push inference runtime
        run: docker push "${{ steps.inference-image.outputs.tag }}"
      - name: Run MLOps training and registration
        env:
          MLOPS_INFERENCE_IMAGE: ${{ steps.inference-image.outputs.tag }}
        run: scripts/run-mlops.sh
