name: CI / Build / Push / Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/cloudapi
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/webapp

jobs:

  # ── Test Backend ────────────────────────────────────────────────────────────
  test-backend:
    name: Test cloudapi
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@0ae58361cdfd39e2950bed97a1e26aa20c3d8955 # v4
        with:
          python-version: '3.11'

      - name: Cache Python dependencies
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('cloudapi/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd cloudapi
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run linting
        run: |
          cd cloudapi
          pip install flake8 black isort
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          black --check . || true
          isort --check-only . || true

      - name: Run security checks
        run: |
          cd cloudapi
          pip install bandit safety
          bandit -r . -x tests || true
          safety check || true

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          DEBUG: 'True'
          DJANGO_SETTINGS_MODULE: orcacloud.settings
        run: |
          cd cloudapi
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          pytest --cov=. --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457
        with:
          files: ./cloudapi/coverage.xml
          flags: cloudapi
          name: cloudapi-coverage

  # ── Test Frontend ───────────────────────────────────────────────────────────
  test-frontend:
    name: Test webapp
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: |
          cd webapp
          npm ci --legacy-peer-deps

      - name: Run linting
        run: |
          cd webapp
          npm run lint || true

      - name: Run type checking
        run: |
          cd webapp
          npm run type-check || true

      - name: Run tests
        run: |
          cd webapp
          npm run test:coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457
        with:
          file: ./webapp/coverage/lcov.info
          flags: webapp
          name: webapp-coverage

  # ── Security Scan ───────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --user "$(id -u):$(id -g)" \
            --env TRIVY_CACHE_DIR=/tmp/trivy-cache \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            fs --format sarif --output /workspace/trivy-results.sarif .

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: 'trivy-results.sarif'

  # ── Build & Push Docker Images ──────────────────────────────────────────────
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [cloudapi, webapp]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            REACT_APP_API_URL=https://api.orcacloud.org/api
            REACT_APP_WS_URL=wss://api.orcacloud.org/ws
            REACT_APP_ENVIRONMENT=production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Development ───────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup kubectl
        uses: azure/setup-kubectl@901a10e89ea615cf61f57ac05cecdf23e7de06d8 # v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k k8s/overlays/dev/
          kubectl set image deployment/orcacloud-backend \
            orcacloud-backend=${{ env.REGISTRY }}/${{ github.repository }}/cloudapi:develop-${{ github.sha }} \
            migrate=${{ env.REGISTRY }}/${{ github.repository }}/cloudapi:develop-${{ github.sha }} \
            --namespace orcacloud
          kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/${{ github.repository }}/webapp:develop-${{ github.sha }} \
            --namespace orcacloud
          kubectl rollout status deployment/orcacloud-backend -n orcacloud
          kubectl rollout status deployment/frontend -n orcacloud

  # ── Deploy to Production ────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy to Production Docker Host
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.PROD_SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '${{ secrets.PROD_SSH_KNOWN_HOSTS }}' > ~/.ssh/known_hosts

      - name: Copy production configuration
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            'mkdir -p "${{ secrets.PROD_DEPLOY_PATH }}/nginx"'
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/docker-compose.yml"
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            nginx/default.conf \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/nginx/default.conf"

      - name: Pull and start production containers
        env:
          CLOUDAPI_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/cloudapi:sha-${{ github.sha }}
          WEBAPP_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/webapp:sha-${{ github.sha }}
        run: |
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "CLOUDAPI_IMAGE='$CLOUDAPI_IMAGE' WEBAPP_IMAGE='$WEBAPP_IMAGE' DEPLOY_PATH='${{ secrets.PROD_DEPLOY_PATH }}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -f .env
          export CLOUDAPI_IMAGE WEBAPP_IMAGE
          docker compose --profile prod pull cloudapi webapp
          docker compose --profile prod up -d --remove-orphans
          docker compose --profile prod ps
          REMOTE

      - name: Run smoke tests
        run: |
          curl --fail --retry 12 --retry-delay 5 https://api.orcacloud.org/api/health/
          curl --fail --retry 12 --retry-delay 5 https://orcacloud.org/
          echo "Deployment successful and smoke tests passed"

  # ── Notify ──────────────────────────────────────────────────────────────────
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-prod]
    if: always() && (needs.deploy-dev.result != 'skipped' || needs.deploy-prod.result != 'skipped')

    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
