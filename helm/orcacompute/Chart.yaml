apiVersion: v2
name: orcacloud
description: A Helm chart for OrcaCloud
type: application
version: 0.1.0
appVersion: "1.0.0"

keywords:
  - orcacloud
  - platform
  - django
  - react
  - postgresql
  - redis

home: https://orcacloud.com
sources:
  - https://github.com/orcacloud/platform

maintainers:
  - name: OrcaCloud DevOps Team
    email: devops@orcacloud.com

dependencies:
  - name: postgresql
    version: ">=10.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: ">=16.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled