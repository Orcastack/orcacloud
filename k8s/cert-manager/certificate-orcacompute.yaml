apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: orcacloud-com-cert
  namespace: orcacloud
spec:
  secretName: orcacloud-com-tls
  dnsNames:
  - api.orcacloud.com
  - www.orcacloud.com
  - orcacloud.com
  issuerRef:
    name: letsencrypt-dns-cloudflare-staging
    kind: ClusterIssuer
  privateKey:
    algorithm: RSA
    size: 2048
  commonName: orcacloud.com
