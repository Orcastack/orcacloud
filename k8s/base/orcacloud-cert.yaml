apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: orcacloud-tls-selfsigned
  namespace: orcacloud
spec:
  secretName: orcacloud-tls-selfsigned
  duration: 2160h # 90d
  renewBefore: 360h
  subject:
    organizations:
    - OrcaCloud
  dnsNames:
  - orcacloud.com
  - www.orcacloud.com
  - api.orcacloud.com
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
