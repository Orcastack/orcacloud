# This rule is not used by the project orcacloud-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to cache.orcacloud.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: orcacloud-operator
    app.kubernetes.io/managed-by: kustomize
  name: orcacloud-viewer-role
rules:
- apiGroups:
  - cache.orcacloud.com
  resources:
  - orcaclouds
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cache.orcacloud.com
  resources:
  - orcaclouds/status
  verbs:
  - get
