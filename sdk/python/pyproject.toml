[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orcacloud-sdk"
version = "0.1.0"
description = "Official Python SDK and CLI for OrcaCloud"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
]

[project.scripts]
orcacloudctl = "orcacloud_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orcacloud_sdk*"]
